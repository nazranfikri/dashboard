<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk - nspace</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F7F4EC;
      color: #2D3748;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Kad Utama Log Masuk */
    .login-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 920px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(63, 108, 81, 0.08), 0 1px 3px rgba(0,0,0,0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(63, 108, 81, 0.1);
    }

    @media (min-width: 768px) {
      .login-card {
        flex-direction: row;
        min-height: 520px;
      }
    }

    /* Bahagian Visual - Imej Unsplash Direct */
    .visual-section {
      background-color: #3F6C51;
      background-image: linear-gradient(135deg, rgba(63, 108, 81, 0.8), rgba(30, 55, 40, 0.88)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=80');
      background-size: cover;
      background-position: center;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      min-height: 240px;
    }

    @media (min-width: 768px) {
      .visual-section {
        width: 48%;
      }
    }

    .brand-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #FFFFFF;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      width: fit-content;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .visual-text {
      color: #FFFFFF;
      margin-top: auto;
    }

    .visual-text h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .visual-text p {
      font-size: 0.95rem;
      opacity: 0.9;
      line-height: 1.5;
    }

    /* Bahagian Borang */
    .form-section {
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    @media (min-width: 768px) {
      .form-section {
        width: 52%;
        padding: 48px;
      }
    }

    .form-header {
      margin-bottom: 32px;
    }

    .form-header h2 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1A202C;
      margin-bottom: 6px;
    }

    .form-header p {
      font-size: 0.9rem;
      color: #718096;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #2D3748;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #E2E8F0;
      border-radius: 10px;
      font-size: 0.95rem;
      background-color: #FAFAFA;
      transition: all 0.25s ease;
      color: #2D3748;
      -webkit-appearance: none;
    }

    .form-group input:focus {
      outline: none;
      border-color: #3F6C51;
      background-color: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(63, 108, 81, 0.12);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #3F6C51;
      color: #FFFFFF;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(63, 108, 81, 0.25);
    }

    .btn-submit:hover {
      background-color: #31553f;
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      background-color: #A0AEC0;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="visual-section">
      <span class="brand-badge">nspace</span>
      <div class="visual-text">
        <h1>Selamat Kembali</h1>
        <p>Akses ruang kerja dan urus tugasan anda dengan lebih teratur.</p>
      </div>
    </div>

    <div class="form-section">
      <div class="form-header">
        <h2>Log Masuk</h2>
        <p>Masukkan butiran akaun anda di bawah.</p>
      </div>

      <div class="login-form">
        <div class="form-group">
          <label for="email">Emel</label>
          <input type="email" id="email" placeholder="nama@email.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Kata Laluan</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="button" id="btnLogin" class="btn-submit">Log Masuk</button>
      </div>
    </div>
  </div>

  <script>
    // Konfigurasi Supabase
    const SUPABASE_URL = 'https://xufwnjjnuqtkfaelxqta.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_1Jm-VKyNa1CTPDbYIeDOwA_mI7zMZIc';
    
    // Inisialisasi Supabase (Sekali sahaja)
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 1. Semak sesi semasa dimuatkan
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error) console.error("Error getSession:", error.message);
        
        if (session) {
          window.location.assign('dashboard.html');
        }
      } catch (err) {
        console.error("Gagal semak sesi:", err.message);
      }
    });

    // 2. Fungsi Log Masuk
    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');

      if (!email || !password) {
        alert('Sila masukkan emel dan kata laluan.');
        return;
      }

      btn.textContent = "Sedang Log Masuk...";
      btn.disabled = true;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          alert('Gagal Log Masuk: ' + error.message);
          btn.textContent = "Log Masuk";
          btn.disabled = false;
        } else if (data && data.session) {
          window.location.assign('dashboard.html');
        } else {
          alert('Log masuk berjaya tetapi tiada sesi dikembalikan.');
          btn.textContent = "Log Masuk";
          btn.disabled = false;
        }
      } catch (err) {
        alert('Ralat Sistem: ' + err.message);
        btn.textContent = "Log Masuk";
        btn.disabled = false;
      }
    }

    // Event Listeners
    document.getElementById('btnLogin').addEventListener('click', doLogin);
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        doLogin();
      }
    });
  </script>

</body>
</html>
