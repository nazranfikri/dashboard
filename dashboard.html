<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Peribadi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --bg:#F7F4EC; --paper:#FFFFFF; --ink:#242A24; --ink-muted:#6E7268;
    --ink-faint:#A3A69B; --line:#E4DFCF; --sage:#3F6C51; --sage-dark:#2C4E39;
    --sage-tint:#E7EFE6; --gold:#B4813C; --gold-tint:#F5E9D6; --danger:#B3503F;
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
    --shadow:0 1px 2px rgba(36,42,36,0.04), 0 4px 16px rgba(36,42,36,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    background-image: radial-gradient(circle, var(--line) 1px, transparent 1px);
    background-size: 22px 22px; background-attachment: fixed;
  }
  
  .app{ display:flex; min-height:100vh; max-width:1280px; margin:0 auto; transition: all 0.3s ease; display: none !important; }
  
  /* Sidebar Collapse Styling */
  .sidebar{ 
    width:260px; flex-shrink:0; padding:24px 16px; display:flex; flex-direction:column; 
    position:sticky; top:0; height:100vh; transition: width 0.3s ease, padding 0.3s ease;
    border-right: 1px solid var(--line); background: var(--bg);
  }
  .app.collapsed .sidebar { width: 70px; padding: 24px 8px; }
  .app.collapsed .sidebar .brand h1, 
  .app.collapsed .sidebar .brand p,
  .app.collapsed .sidebar .user-email,
  .app.collapsed .sidebar .nav-text,
  .app.collapsed .sidebar .btn-text { display: none; }
  .app.collapsed .sidebar .brand-mark { margin-bottom: 0; }
  .app.collapsed .sidebar .user-profile-badge { text-align: center; padding: 8px 4px; }

  .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .toggle-btn { background: none; border: none; cursor: pointer; color: var(--ink); padding: 6px; border-radius: var(--radius-sm); }
  .toggle-btn:hover { background: var(--line); }

  .brand-mark{
    width:34px;height:34px; border-radius:99px; background:var(--sage); color:#fff;
    display:flex;align-items:center;justify-content:center; font-family:'Fraunces',serif; font-size:17px;
  }
  .brand h1{font-family:'Fraunces',serif; font-size:18px; color:var(--ink); margin:0;}
  .brand p{margin:2px 0 0; font-size:11.5px; color:var(--ink-faint);}

  .user-profile-badge {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 10px; margin-bottom: 16px; font-size: 12px;
  }
  .user-email { font-weight: 600; color: var(--ink); word-break: break-all; margin-bottom: 4px; }

  nav{display:flex; flex-direction:column; gap:4px; flex:1;}
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:10px 12px;
    border:none; background:none; border-radius:var(--radius-sm); color:var(--ink-muted);
    font-size:14px; font-weight:500; text-align:left; cursor:pointer;
  }
  .nav-item svg{width:18px;height:18px; flex-shrink:0;}
  .nav-item:hover{background:rgba(63,108,81,0.07); color:var(--ink);}
  .nav-item.active{ background:var(--sage-tint); color:var(--sage-dark); font-weight:600; }

  .sidebar-footer{ display:flex; flex-direction:column; gap:6px; padding-top:16px; margin-top:auto; border-top:1px solid var(--line); }
  .ghost-btn{
    display:flex; align-items:center; gap:9px; border:none; background:none;
    padding:8px 12px; border-radius:var(--radius-sm); font-size:12.5px; color:var(--ink-faint); cursor:pointer;
  }
  .ghost-btn:hover{background:rgba(36,42,36,0.04); color:var(--ink-muted);}

  main{ flex:1; padding:36px 40px; min-width:0; }
  .view{display:none;}
  .view.active{display:block;}

  .view-header{margin-bottom:24px;}
  .view-header h2{font-family:'Fraunces',serif; font-size:26px; color:var(--ink); margin:0;}
  .view-header p{margin:4px 0 0; font-size:13.5px; color:var(--ink-muted);}
  .card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); }

  /* Form & Fields */
  label{ display:block; font-size:12px; font-weight:600; color:var(--ink-muted); margin-bottom:6px; }
  input, select, textarea{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius-sm);
    background:#FEFDFB; font-size:13.5px; color:var(--ink); font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--sage); outline:none; box-shadow:0 0 0 3px var(--sage-tint);}
  .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .form-col { flex: 1; }

  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:var(--radius-sm);
    font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer;
  }
  .btn-primary{background:var(--sage); border-color:var(--sage); color:#fff;}
  .btn-primary:hover{background:var(--sage-dark);}

  /* Task Filters & Badges */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filter-chip { 
    padding: 6px 14px; border-radius: 99px; border: 1px solid var(--line); 
    background: var(--paper); font-size: 12.5px; cursor: pointer; color: var(--ink-muted);
  }
  .filter-chip.active { background: var(--sage); color: #fff; border-color: var(--sage); }

  .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; display: inline-block; }
  .badge-p-high { background: #FDE8E8; color: #9B1C1C; }
  .badge-p-medium { background: #FEF08A; color: #713F12; }
  .badge-p-low { background: #E1EFFE; color: #1E429F; }
  .badge-cat { background: var(--sage-tint); color: var(--sage-dark); }

  /* Task List Item */
  .add-form{padding:20px; margin-bottom:20px;}
  .task-list{display:flex; flex-direction:column; gap:8px;}
  .task-item{ display:flex; align-items:flex-start; gap:12px; padding:14px 16px; }
  .task-check{ width:18px; height:18px; margin-top:2px; accent-color:var(--sage); cursor:pointer; }
  .task-body{flex:1; min-width:0;}
  .task-header-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .task-title{font-size:14px; font-weight:600; margin:0;}
  .task-remark{font-size:12.5px; color:var(--ink-muted); margin:0; line-height:1.4;}
  .task-item.done .task-title, .task-item.done .task-remark { color:var(--ink-faint); text-decoration:line-through; }
  .task-actions { display: flex; gap: 4px; }
  
  .icon-btn{ border:none; background:none; color:var(--ink-faint); padding:4px 6px; border-radius:var(--radius-sm); cursor:pointer; font-size: 12px; }
  .icon-btn:hover{color:var(--ink); background:var(--line);}

  /* Modal Edit */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 100; }
  .modal.active { display: flex; }
  .modal-content { background: var(--paper); padding: 24px; border-radius: var(--radius-md); width: 100%; max-width: 450px; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">N</div>
        <div style="margin-top: 8px;">
          <h1>nspace</h1>
          <p>Personal Workspace</p>
        </div>
      </div>
      <button class="toggle-btn" id="toggleSidebar" title="Collapse Sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>

    <div class="user-profile-badge">
      <div class="user-email" id="userEmailDisplay">...</div>
      <a href="#" id="btnLogout" style="color:var(--danger); font-size:11px; text-decoration:none; font-weight:600;">Log Keluar</a>
    </div>

    <nav>
      <button class="nav-item active" data-view="todo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>
        <span class="nav-text">Tugasan</span>
      </button>
      <button class="nav-item" data-view="contacts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
        <span class="nav-text">Kenalan</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button class="ghost-btn" id="exportBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span class="btn-text">Eksport Backup JSON</span>
      </button>
      <button class="ghost-btn" id="importBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="btn-text">Import JSON</span>
      </button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
  </aside>

  <main>
    <!-- TODO VIEW -->
    <section class="view active" id="view-todo">
      <div class="view-header">
        <h2>Senarai Tugasan</h2>
        <p>Urus tugas harian, keutamaan dan kategori.</p>
      </div>

      <!-- Form Tambah -->
      <div class="card add-form">
        <div class="form-row">
          <div class="form-col" style="flex:2;">
            <label>Tugasan</label>
            <input type="text" id="taskTitle" placeholder="Tajuk tugasan baharu...">
          </div>
          <div class="form-col">
            <label>Kategori</label>
            <select id="taskCategory">
              <option value="Kerja">Kerja</option>
              <option value="Peribadi">Peribadi</option>
              <option value="Projek">Projek</option>
              <option value="Kewangan">Kewangan</option>
              <option value="Lain-lain">Lain-lain</option>
            </select>
          </div>
          <div class="form-col">
            <label>Priority</label>
            <select id="taskPriority">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-col">
            <label>Catatan / Nota</label>
            <input type="text" id="taskRemark" placeholder="Nota tambahan (opsional)...">
          </div>
        </div>
        <button class="btn btn-primary" id="addTaskBtn">Tambah Tugasan</button>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar">
        <span style="font-size:12px; font-weight:600; color:var(--ink-muted); margin-right:4px;">Tapis:</span>
        <button class="filter-chip active" data-filter="All">Semua</button>
        <button class="filter-chip" data-filter="Kerja">Kerja</button>
        <button class="filter-chip" data-filter="Peribadi">Peribadi</button>
        <button class="filter-chip" data-filter="Projek">Projek</button>
        <button class="filter-chip" data-filter="Kewangan">Kewangan</button>
      </div>

      <!-- List -->
      <div class="task-list card" id="taskList" style="padding:10px;"></div>
    </section>

    <!-- CONTACTS VIEW -->
    <section class="view" id="view-contacts">
      <div class="view-header"><h2>Kenalan</h2><p>Simpan senarai kenalan anda.</p></div>
      <div class="card add-form">
        <div class="form-row">
          <div class="form-col"><label>Nama</label><input type="text" id="cName"></div>
          <div class="form-col"><label>Emel</label><input type="email" id="cEmail"></div>
        </div>
        <button class="btn btn-primary" id="addContactBtn">Tambah Kenalan</button>
      </div>
      <div id="contactGrid" class="task-list card" style="padding:10px;"></div>
    </section>
  </main>
</div>

<!-- MODAL EDIT TASK -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3 style="margin-top:0; font-family:'Fraunces',serif;">Kemaskini Tugasan</h3>
    <input type="hidden" id="editTaskId">
    <div style="margin-bottom:12px;">
      <label>Tajuk Tugasan</label>
      <input type="text" id="editTaskTitle">
    </div>
    <div class="form-row">
      <div class="form-col">
        <label>Kategori</label>
        <select id="editTaskCategory">
          <option value="Kerja">Kerja</option>
          <option value="Peribadi">Peribadi</option>
          <option value="Projek">Projek</option>
          <option value="Kewangan">Kewangan</option>
          <option value="Lain-lain">Lain-lain</option>
        </select>
      </div>
      <div class="form-col">
        <label>Priority</label>
        <select id="editTaskPriority">
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom:16px;">
      <label>Catatan</label>
      <input type="text" id="editTaskRemark">
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn" id="closeModalBtn">Batal</button>
      <button class="btn btn-primary" id="saveEditBtn">Simpan Kemaskini</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const SUPABASE_URL = 'https://XXXXXXXXXXXXXX.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsIn...';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let tasksState = [];
  let currentFilter = "All";

  // --- 1. COLLAPSE SIDEBAR ---
  document.getElementById("toggleSidebar").addEventListener("click", () => {
    document.querySelector(".app").classList.toggle("collapsed");
  });

  // --- 2. GUARD ROUTE ---
  async function guardRoute() {
    const { data: { session }, error } = await supabase.auth.getSession();
    if (error || !session) {
      window.location.replace('index.html');
      return;
    }
    currentUser = session.user;
    document.getElementById("userEmailDisplay").textContent = currentUser.email;
    document.querySelector(".app").style.setProperty("display", "flex", "important");
    loadTasks();
  }

  document.getElementById("btnLogout").addEventListener("click", async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.replace('index.html');
  });

  // --- 3. LOAD & RENDER TASKS ---
  async function loadTasks() {
    const { data } = await supabase.from('tasks').select('*').order('created_at', { ascending: false });
    tasksState = data || [];
    renderTasks();
  }

  function renderTasks() {
    const list = document.getElementById("taskList");
    let filtered = tasksState;
    if (currentFilter !== "All") {
      filtered = tasksState.filter(t => (t.category || "Lain-lain") === currentFilter);
    }

    if (!filtered.length) {
      list.innerHTML = `<p style="text-align:center; color:var(--ink-faint); padding:20px;">Tiada tugasan ditemui.</p>`;
      return;
    }

    list.innerHTML = filtered.map(t => {
      const p = t.priority || "Medium";
      const c = t.category || "Lain-lain";
      return `
        <div class="task-item ${t.completed ? 'done' : ''}">
          <input type="checkbox" class="task-check" ${t.completed ? 'checked' : ''} data-id="${t.id}">
          <div class="task-body">
            <div class="task-header-row">
              <span class="badge badge-cat">${c}</span>
              <span class="badge badge-p-${p.toLowerCase()}">${p}</span>
              <p class="task-title">${t.title}</p>
            </div>
            ${t.remark ? `<p class="task-remark">${t.remark}</p>` : ''}
          </div>
          <div class="task-actions">
            <button class="icon-btn edit-btn" data-id="${t.id}">Edit</button>
            <button class="icon-btn delete-btn" data-id="${t.id}" style="color:var(--danger);">Padam</button>
          </div>
        </div>
      `;
    }).join("");

    // Attach Event Listeners
    list.querySelectorAll(".task-check").forEach(cb => {
      cb.addEventListener("change", async () => {
        const id = cb.dataset.id;
        const status = cb.checked;
        await supabase.from('tasks').update({ completed: status }).eq('id', id);
        const t = tasksState.find(x => x.id === id);
        if(t) t.completed = status;
        renderTasks();
      });
    });

    list.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.id;
        await supabase.from('tasks').delete().eq('id', id);
        tasksState = tasksState.filter(x => x.id !== id);
        renderTasks();
      });
    });

    list.querySelectorAll(".edit-btn").forEach(btn => {
      btn.addEventListener("click", () => openEditModal(btn.dataset.id));
    });
  }

  // Add Task
  document.getElementById("addTaskBtn").addEventListener("click", async () => {
    const title = document.getElementById("taskTitle").value.trim();
    if (!title) return;

    const newTask = {
      title,
      category: document.getElementById("taskCategory").value,
      priority: document.getElementById("taskPriority").value,
      remark: document.getElementById("taskRemark").value.trim(),
      completed: false,
      user_id: currentUser.id
    };

    const { data } = await supabase.from('tasks').insert([newTask]).select();
    if (data) {
      tasksState.unshift(data[0]);
      renderTasks();
      document.getElementById("taskTitle").value = "";
      document.getElementById("taskRemark").value = "";
    }
  });

  // Filter Chips
  document.querySelectorAll(".filter-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentFilter = chip.dataset.filter;
      renderTasks();
    });
  });

  // --- 4. EDIT TASK MODAL ---
  const editModal = document.getElementById("editModal");
  function openEditModal(id) {
    const t = tasksState.find(x => x.id === id);
    if (!t) return;
    document.getElementById("editTaskId").value = t.id;
    document.getElementById("editTaskTitle").value = t.title;
    document.getElementById("editTaskCategory").value = t.category || "Lain-lain";
    document.getElementById("editTaskPriority").value = t.priority || "Medium";
    document.getElementById("editTaskRemark").value = t.remark || "";
    editModal.classList.add("active");
  }

  document.getElementById("closeModalBtn").addEventListener("click", () => editModal.classList.remove("active"));

  document.getElementById("saveEditBtn").addEventListener("click", async () => {
    const id = document.getElementById("editTaskId").value;
    const updates = {
      title: document.getElementById("editTaskTitle").value.trim(),
      category: document.getElementById("editTaskCategory").value,
      priority: document.getElementById("editTaskPriority").value,
      remark: document.getElementById("editTaskRemark").value.trim()
    };

    await supabase.from('tasks').update(updates).eq('id', id);
    const idx = tasksState.findIndex(x => x.id === id);
    if (idx !== -1) tasksState[idx] = { ...tasksState[idx], ...updates };
    
    editModal.classList.remove("active");
    renderTasks();
  });

  // --- 5. FIX EXPORT & IMPORT DATA ---
  document.getElementById("exportBtn").addEventListener("click", async () => {
    const { data: tasks } = await supabase.from('tasks').select('*');
    const { data: contacts } = await supabase.from('contacts').select('*');
    
    const backupData = {
      exported_at: new Date().toISOString(),
      user_email: currentUser.email,
      tasks: tasks || [],
      contacts: contacts || []
    };

    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `nspace_backup_${Date.now()}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  });

  document.getElementById("importBtn").addEventListener("click", () => {
    document.getElementById("importFile").click();
  });

  document.getElementById("importFile").addEventListener("change", (e) => {
    const fileReader = new FileReader();
    fileReader.onload = async (event) => {
      try {
        const importedJson = JSON.parse(event.target.result);
        if (importedJson.tasks && Array.isArray(importedJson.tasks)) {
          const tasksToInsert = importedJson.tasks.map(t => {
            delete t.id; // buang ID lama supaya Supabase jana UUID baharu
            t.user_id = currentUser.id;
            return t;
          });
          await supabase.from('tasks').insert(tasksToInsert);
        }
        alert("Import data berjaya!");
        loadTasks();
      } catch (err) {
        alert("Fail JSON tidak sah!");
      }
    };
    if (e.target.files[0]) fileReader.readAsText(e.target.files[0]);
  });

  // Views Navigation
  document.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("view-" + btn.dataset.view).classList.add("active");
    });
  });

  guardRoute();
})();
</script>
</body>
</html>
